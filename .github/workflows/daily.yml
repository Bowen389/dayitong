name: 大一统盘后预案
on:
  schedule:
    # 延后 65 分钟等 6 个上游落盘｜18:25 二次补齐｜21:00｜次日 08:30
    - cron: '5 10 * * 1-5'
    - cron: '25 10 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '30 0 * * 2-6'
  workflow_dispatch:
    inputs:
      date:
        description: 已收盘交易日 YYYY-MM-DD
        required: false
        type: string
  push:
    branches: [main]
    paths: ['daily.py', 'aggregate_watch.py', 'firstboard_source.py', 'test_firstboard_source.py', '.github/workflows/daily.yml']

permissions:
  contents: write
concurrency:
  group: dayitong-report
  # Code updates supersede obsolete aggregate-only runs; scheduled runs keep recovery ordering.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'exchange-calendars>=4.11,<5' akshare==1.20.65
      - uses: actions/cache@v4
        with:
          path: |
            data/factors
            data/firstboard
          key: aggregate-factors-${{ github.run_id }}
          restore-keys: aggregate-factors-
      - run: python -m unittest test_recovery test_firstboard_source -v
      - name: Follow upstream updates and rebuild dated aggregate
        env:
          REPORT_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          wait_seconds=0
          # 兜底补丁：workflow_dispatch 也要等上游，否则 watchdog 每次触发都必然 PARTIAL exit 2
          case "$EVENT_NAME" in
            schedule|workflow_dispatch) wait_seconds=1200 ;;
          esac
          python -u aggregate_watch.py --wait-seconds "$wait_seconds" "${args[@]}"
      - name: 发布 Markdown 和 JSON
        if: always()
        run: |
          if [[ ! -d reports ]]; then exit 0; fi
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish dayitong report'
          git pull --rebase origin main
          git push origin HEAD:main
